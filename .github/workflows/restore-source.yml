name: Restore PortScope app source

on:
  push:
    paths:
      - ".github/workflows/restore-source.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  restore:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - name: Verify source archive and extract application
        shell: bash
        run: |
          set -euo pipefail
          printf '%s  %s\n' "68f64c5e729a54b263f498360f9448a3f91575f0e1b970b6535c55fd5842c47c" "PortScope-Source.tar.xz" | sha256sum --check
          tar -tJf PortScope-Source.tar.xz | while IFS= read -r path; do
            case "$path" in
              /*|../*|*/../*|*/..) echo "Unsafe path in archive: $path"; exit 1;;
            esac
          done
          tar -xJf PortScope-Source.tar.xz -C .
          # Preview is distributed separately; omit broken embedded image reference.
          sed -i '/^!\[Dashboard preview\](preview.png)$/d' README.md
          rm -rf bundle
      - name: Commit restored app source
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "App source is already present."
            exit 0
          fi
          git commit -m "Restore runnable PortScope v1.0 application files"
          git push origin HEAD:main
